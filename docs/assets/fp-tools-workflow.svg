<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="map-title map-description">
  <title id="map-title">fp-tools workflow map: inputs, analysis and results</title>
  <desc id="map-description">Bulk samples start with sorted alignments, indexes and peak regions. The bulk-footprinting workflow corrects bias, scores footprints, matches motifs, compares conditions and builds an interactive review. Single-cell fragments and annotations are grouped into pseudobulk samples; sc-footprinting corrects bias, scores footprints and compares motifs before find-signature-fp calculates per-cell signatures using the original fragments, annotations and matching genomic-bin counts. Optional motif discovery starts from candidate intervals exported by call-footprints. FASTQ preparation is a separate Linux-only command. All routes need matched genome inputs. Footprints and motif matches do not prove protein binding.</desc>
  <!-- Original fp-tools artwork; metro-map presentation inspired by nf-core/rnaseq.
       The animated companion differs only by its optional motion style. -->
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#17364d}
    .title{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#486277}
    .heading{font-size:20px;font-weight:700}.label{font-size:18px;font-weight:700}
    .command{font-size:16px}.detail{font-size:15px;fill:#486277}
    .small{font-size:14px;fill:#486277}.center{text-anchor:middle}.end{text-anchor:end}
    .rail{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .bulk{stroke:#1967b3}.cell{stroke:#008577}.discovery{stroke:#7950b0}
    .station{fill:white;stroke-width:3}.input{fill:white;stroke:#d5e1ea;stroke-width:1.5}
    .marker{display:none}.blue{fill:#1967b3}.teal{fill:#007b70}.purple{fill:#7047a7}
  </style>
  <defs>
    <marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#1967b3"/></marker>
    <marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#008577"/></marker>
    <marker id="purple-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#7950b0"/></marker>
  </defs>
  <rect width="1200" height="920" rx="18" fill="#ffffff"/>
  <text x="32" y="48" class="title">From your data to footprint patterns</text>
  <text x="32" y="78" class="subtitle">Choose a starting point. Follow the route. Inspect the results.</text>
  <text x="1168" y="47" class="heading end blue">fp-tools</text>

  <g id="optional-preparation">
    <rect x="24" y="104" width="1152" height="64" rx="12" fill="#f5f7f9" stroke="#e0e7ed"/>
    <text x="44" y="129" class="detail">Optional preparation · Linux command line/container only</text>
    <text x="44" y="153" class="label">Raw reads (FASTQ)</text>
    <path d="M231 147 H285 M458 147 H508" class="rail" stroke="#8796a4" stroke-width="2" stroke-dasharray="4 6"/>
    <text x="302" y="153" class="command">prepare-atac</text>
    <text x="528" y="153" class="detail">Bulk-ready alignments, indexes and peaks</text>
    <text x="1154" y="133" class="detail end">Desktop and bulk workflows</text>
    <text x="1154" y="154" class="detail end">start with prepared inputs below.</text>
  </g>

  <g id="bulk-route">
    <rect x="24" y="188" width="1152" height="210" rx="14" fill="#f2f7fc"/>
    <text x="44" y="220" class="heading blue">01  Bulk samples</text>
    <text x="1154" y="220" class="command end blue">Run the workflow: bulk-footprinting</text>
    <rect x="44" y="250" width="190" height="94" rx="10" class="input"/>
    <text x="60" y="275" class="label">Aligned reads</text>
    <text x="60" y="299" class="detail">Sorted BAM + BAI index</text>
    <text x="60" y="323" class="detail">Peak regions (BED)</text>
    <path d="M234 304 H1138" class="rail bulk" marker-end="url(#blue-arrow)"/>
    <g class="center">
      <text x="330" y="264" class="label">Correct bias</text>
      <text x="330" y="288" class="command">atac-correct</text>
      <circle cx="330" cy="304" r="8" class="station bulk"/>
      <text x="330" y="340" class="detail">Corrected signal</text>
      <text x="510" y="264" class="label">Score footprints</text>
      <text x="510" y="288" class="command">call-footprints</text>
      <circle cx="510" cy="304" r="8" class="station bulk"/>
      <text x="510" y="340" class="detail">Footprint tracks</text>
      <text x="690" y="264" class="label">Match motifs</text>
      <text x="690" y="288" class="command">match-motifs</text>
      <circle cx="690" cy="304" r="8" class="station bulk"/>
      <text x="690" y="340" class="detail">Motif sites + scores</text>
      <text x="870" y="264" class="label">Compare conditions</text>
      <text x="870" y="288" class="command">diff-footprints</text>
      <circle cx="870" cy="304" r="8" class="station bulk"/>
      <text x="870" y="340" class="detail">Tables + profiles</text>
      <text x="1066" y="264" class="label">Explore results</text>
      <text x="1066" y="288" class="command">review-multi-comparisons</text>
      <circle cx="1066" cy="304" r="8" class="station bulk"/>
      <text x="1066" y="340" class="detail">Interactive reports</text>
    </g>
    <text x="44" y="376" class="detail">Also provide sample and comparison tables. Review aggregate profiles alongside differential statistics.</text>
    <circle r="5" fill="#ffffff" stroke="#1967b3" stroke-width="2" class="marker bulk-marker"/>
  </g>

  <g id="single-cell-route">
    <rect x="24" y="418" width="1152" height="242" rx="14" fill="#eff8f6"/>
    <text x="44" y="450" class="heading teal">02  Single cells</text>
    <text x="1154" y="450" class="command end teal">Run the workflow: sc-footprinting</text>
    <rect x="44" y="480" width="190" height="94" rx="10" class="input"/>
    <text x="60" y="505" class="label">Fragments</text>
    <text x="60" y="529" class="detail">Cell barcodes</text>
    <text x="60" y="553" class="detail">+ cell annotations</text>
    <path d="M234 534 H1138" class="rail cell" marker-end="url(#teal-arrow)"/>
    <g class="center">
      <text x="330" y="494" class="label">Group cells</text>
      <text x="330" y="518" class="command">pseudobulk-fragments</text>
      <circle cx="330" cy="534" r="8" class="station cell"/>
      <text x="330" y="570" class="detail">Pseudobulk groups</text>
      <text x="510" y="494" class="label">Correct bias</text>
      <text x="510" y="518" class="command">atac-correct</text>
      <circle cx="510" cy="534" r="8" class="station cell"/>
      <text x="510" y="570" class="detail">Corrected signal</text>
      <text x="690" y="494" class="label">Score footprints</text>
      <text x="690" y="518" class="command">call-footprints</text>
      <circle cx="690" cy="534" r="8" class="station cell"/>
      <text x="690" y="570" class="detail">Group tracks</text>
      <text x="870" y="494" class="label">Compare motifs</text>
      <text x="870" y="518" class="command">diff-footprints</text>
      <circle cx="870" cy="534" r="8" class="station cell"/>
      <text x="870" y="570" class="detail">Sites + group results</text>
      <text x="1066" y="494" class="label">Per-cell signatures</text>
      <text x="1066" y="518" class="command">find-signature-fp</text>
      <circle cx="1066" cy="534" r="8" class="station cell"/>
      <text x="1066" y="570" class="detail">Heatmaps + cell maps</text>
    </g>
    <text x="44" y="610" class="detail">Pseudobulk = fragments combined</text>
    <text x="44" y="632" class="detail">from cells in the same group.</text>
    <rect x="405" y="592" width="632" height="48" rx="9" class="input"/>
    <text x="421" y="612" class="detail">Per-cell inputs: original fragments + annotations + matching cells in</text>
    <text x="421" y="631" class="detail">AnnData (.h5ad) with genomic-bin counts, not an embedding alone.</text>
    <path d="M1037 616 H1088 Q1104 616 1104 600 V585" fill="none" stroke="#008577" stroke-width="2" marker-end="url(#teal-arrow)"/>
    <circle r="5" fill="#ffffff" stroke="#008577" stroke-width="2" class="marker cell-marker"/>
  </g>

  <g id="discovery-route">
    <rect x="24" y="680" width="1152" height="140" rx="14" fill="#f6f2fb"/>
    <text x="44" y="712" class="heading purple">03  Optional: discover new motifs</text>
    <path d="M320 759 H1138" class="rail discovery" marker-end="url(#purple-arrow)"/>
    <rect x="44" y="728" width="352" height="70" rx="10" class="input"/>
    <text x="60" y="753" class="label">Candidate footprint intervals</text>
    <text x="60" y="778" class="command">call-footprints --output-bed</text>
    <g class="center">
      <text x="596" y="743" class="command">discover-motifs</text>
      <circle cx="596" cy="759" r="8" class="station discovery"/>
      <text x="596" y="792" class="detail">Discover + compare with known motifs</text>
      <text x="1000" y="743" class="label">Motif report + tables</text>
      <circle cx="1000" cy="759" r="8" class="station discovery"/>
      <text x="1000" y="792" class="detail">Rebuild with summarize-motifs</text>
    </g>
    <circle r="5" fill="#ffffff" stroke="#7950b0" stroke-width="2" class="marker discovery-marker"/>
  </g>

  <text x="32" y="850" class="detail">Use the same genome build for reads, peaks and reference DNA. Supply known or custom motifs where required.</text>
  <text x="32" y="874" class="detail">Bulk: managed hg38/mm10 include matched blacklists. Custom-reference blacklists must be supplied explicitly.</text>
  <text x="32" y="902" class="small">Footprints and motif matches do not prove binding. Per-cell signatures use neighboring cells; they are not independent binding calls.</text>
</svg>
