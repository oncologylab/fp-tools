[build-system]
# setuptools does the build; Cython & NumPy headers are available at build time
requires = [
  "setuptools>=68",
  "wheel",
  "Cython>=3.0,<3.2",
  "numpy>=1.22"
]
build-backend = "setuptools.build_meta"

[project]
name = "fp-tools-bio"
version = "0.2.0rc4"
description = "Standalone footprint tools with vendored Cython internals"
readme = "README.md"
license = "MIT"
authors = [{ name = "Yaoxiang Li" }]
requires-python = ">=3.11"
keywords = ["ATAC-seq", "footprinting", "motif", "chromatin", "bioinformatics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Cython",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Runtime deps (unified here so pip/wheel installs work without Poetry)
dependencies = [
  "numpy>=1.22,<3.0",
  "scipy>=1.16,<2.0",
  "pysam>=0.23.3,<0.24.0; platform_system != 'Windows'",
  "bamnostic>=1.3,<2.0; platform_system == 'Windows'",
  "pyBigWig>=0.3.24,<0.4.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "pybigtools>=0.3.0,<0.4.0",
  "pyfastx>=2.3.1,<3.0; platform_system == 'Windows'",
  "matplotlib>=3.10,<4.0",
  "pandas>=2.3.3,<3.0",
  "seaborn>=0.13.2,<0.14.0",
  "scikit-learn>=1.5,<2.0",
  "tqdm>=4.66,<5.0",
  "kneed>=0.8.5,<0.9.0",
  "adjustText>=1.3.0,<2.0.0",
  "biopython>=1.85,<2.0",
  "logomaker>=0.8.7,<0.9.0",
  "xlsxwriter>=3.2.9,<4.0.0",
  "anndata>=0.12,<0.13",
  "PyYAML>=6.0,<7.0",
  "streamlit>=1.44,<2.0"
]

[project.optional-dependencies]
gui = []
all = []
docs = [
  "mkdocs>=1.6,<2.0",
  "mkdocs-material>=9.5,<10.0",
  "mkdocstrings[python]>=0.26,<1.0",
  "mkdocs-git-revision-date-localized-plugin>=1.2,<2.0"
]

[project.urls]
Homepage = "https://github.com/oncologylab/fp-tools"
Repository = "https://github.com/oncologylab/fp-tools"
Issues = "https://github.com/oncologylab/fp-tools/issues"

[project.scripts]
atac-correct = "fp_tools.cli:main"
call-footprints = "fp_tools.cli_scorebigwig:main"
match-motifs = "fp_tools.tools.match_motifs:main"
diff-footprints = "fp_tools.tools.diff_footprints:diff_footprints_cli"
normalize-bigwig = "fp_tools.tools.normalize_bigwig:main"
plot-aggregate = "fp_tools.cli_plotaggregate:main"
review-multi-comparisons = "fp_tools.tools.review_multi_comparisons:main"
plot-motif-aggregate-grid = "fp_tools.cli_compat:plot_motif_aggregate_grid_main"
prepare-atac = "fp_tools.tools.prepare_atac:main"
bulk-footprinting = "fp_tools.tools.bulk_footprinting:main"
run-yaml-workflow = "fp_tools.cli_batch:main"
run-workflow = "fp_tools.cli_compat:run_workflow_main"
fp-tools-gui = "fp_tools.cli_gui:main"
discover-motifs = "fp_tools.tools.motif_discovery:motif_discovery_plan_main"
summarize-motifs = "fp_tools.tools.motif_discovery:motif_report_main"
motif-discovery = "fp_tools.cli_compat:motif_discovery_main"
motif-summary = "fp_tools.cli_compat:motif_summary_main"
pseudobulk-fragments = "fp_tools.tools.pseudobulk:main"
find-signature-fp = "fp_tools.tools.find_signature_fp:main"
sc-footprinting = "fp_tools.tools.pseudobulk_footprints:main"
pseudobulk-footprints = "fp_tools.cli_compat:pseudobulk_footprints_main"

[tool.fp-tools]
public-console-scripts = [
  "prepare-atac", "bulk-footprinting", "atac-correct", "call-footprints",
  "match-motifs", "diff-footprints", "normalize-bigwig", "plot-aggregate",
  "review-multi-comparisons", "run-yaml-workflow", "fp-tools-gui",
  "discover-motifs", "summarize-motifs", "pseudobulk-fragments",
  "find-signature-fp", "sc-footprinting"
]
deprecated-console-scripts = [
  "plot-motif-aggregate-grid", "run-workflow", "motif-discovery",
  "motif-summary", "pseudobulk-footprints"
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where   = ["src"]
include = ["fp_tools*"]

# ship .pyx/.pxd in sdists so downstream builds can compile
[tool.setuptools.package-data]
"fp_tools.utils" = ["*.pyx", "*.pxd"]
"fp_tools.resources.motifs" = ["*.txt"]
"fp_tools.resources.static_browser" = ["*.html", "*.js", "*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data", "site", ".git", ".venv"]
pythonpath = ["."]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
test-command = [
  "python -m pip check",
  "atac-correct --help",
  "call-footprints --help",
  "diff-footprints --help",
  "fp-tools-gui --help"
]

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

# --- Poetry mirror of the important bits so `poetry build` works too ---
[tool.poetry]
name = "fp-tools-bio"
version = "0.2.0rc4"
description = "Standalone footprint tools with vendored Cython internals"
authors = ["Yaoxiang Li"]
readme = "README.md"
packages = [{ include = "fp_tools", from = "src" }]
include = ["src/fp_tools/resources/motifs/*.txt", "src/fp_tools/resources/static_browser/*"]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
numpy = ">=1.22,<3.0"
scipy = ">=1.16,<2.0"
pysam = { version = ">=0.23.3,<0.24.0", markers = "platform_system != 'Windows'" }
bamnostic = { version = ">=1.3,<2.0", markers = "platform_system == 'Windows'" }
pybigwig = { version = ">=0.3.24,<0.4.0", markers = "platform_system == 'Linux' and platform_machine == 'x86_64'" }
pybigtools = ">=0.3.0,<0.4.0"
pyfastx = { version = ">=2.3.1,<3.0", markers = "platform_system == 'Windows'" }
matplotlib = ">=3.10,<4.0"
pandas = ">=2.3.3,<3.0"
seaborn = ">=0.13.2,<0.14.0"
scikit-learn = ">=1.5,<2.0"
tqdm = ">=4.66,<5.0"
kneed = ">=0.8.5,<0.9.0"
adjusttext = ">=1.3.0,<2.0.0"
biopython = ">=1.85,<2.0"
logomaker = ">=0.8.7,<0.9.0"
xlsxwriter = ">=3.2.9,<4.0.0"
anndata = ">=0.12,<0.13"
pyyaml = ">=6.0,<7.0"
streamlit = ">=1.44,<2.0"
mkdocs = { version = ">=1.6,<2.0", optional = true }
mkdocs-material = { version = ">=9.5,<10.0", optional = true }
mkdocstrings = { version = ">=0.26,<1.0", extras = ["python"], optional = true }
mkdocs-git-revision-date-localized-plugin = { version = ">=1.2,<2.0", optional = true }

[tool.poetry.extras]
gui = []
all = []
docs = ["mkdocs", "mkdocs-material", "mkdocstrings", "mkdocs-git-revision-date-localized-plugin"]

[tool.poetry.scripts]
atac-correct = "fp_tools.cli:main"
call-footprints = "fp_tools.cli_scorebigwig:main"
match-motifs = "fp_tools.tools.match_motifs:main"
diff-footprints = "fp_tools.tools.diff_footprints:diff_footprints_cli"
normalize-bigwig = "fp_tools.tools.normalize_bigwig:main"
plot-aggregate = "fp_tools.cli_plotaggregate:main"
review-multi-comparisons = "fp_tools.tools.review_multi_comparisons:main"
plot-motif-aggregate-grid = "fp_tools.cli_compat:plot_motif_aggregate_grid_main"
prepare-atac = "fp_tools.tools.prepare_atac:main"
bulk-footprinting = "fp_tools.tools.bulk_footprinting:main"
run-yaml-workflow = "fp_tools.cli_batch:main"
run-workflow = "fp_tools.cli_compat:run_workflow_main"
fp-tools-gui = "fp_tools.cli_gui:main"
discover-motifs = "fp_tools.tools.motif_discovery:motif_discovery_plan_main"
summarize-motifs = "fp_tools.tools.motif_discovery:motif_report_main"
motif-discovery = "fp_tools.cli_compat:motif_discovery_main"
motif-summary = "fp_tools.cli_compat:motif_summary_main"
pseudobulk-fragments = "fp_tools.tools.pseudobulk:main"
find-signature-fp = "fp_tools.tools.find_signature_fp:main"
sc-footprinting = "fp_tools.tools.pseudobulk_footprints:main"
pseudobulk-footprints = "fp_tools.cli_compat:pseudobulk_footprints_main"
