site_name: fp-tools
site_description: Command-first ATAC-seq footprinting, motif analysis, and pseudobulk utilities.
site_url: https://oncologylab.github.io/fp-tools/
repo_url: https://github.com/oncologylab/fp-tools
repo_name: oncologylab/fp-tools

theme:
  name: material
  logo: assets/fp_tools_logo_icon.svg
  favicon: assets/fp_tools_logo_icon.svg
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

nav:
  - Get Started: index.md
  - Output Demo: reports.md
  - GUI Demo: gui.md
  - API Reference: api.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/oncologylab/fp-tools
      name: fp-tools on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/fp-tools-bio/
      name: fp-tools-bio on PyPI
