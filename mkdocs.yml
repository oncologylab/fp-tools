site_name: fp-tools
site_description: Command-first ATAC-seq footprinting, motif analysis, and pseudobulk utilities.
site_url: https://oncologylab.github.io/fp-tools/
repo_url: https://github.com/oncologylab/fp-tools
repo_name: oncologylab/fp-tools

theme:
  name: material
  font: false
  logo: assets/fp_tools_logo_icon.svg
  favicon: assets/fp_tools_logo_icon.svg
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/layout.js

nav:
  - Get Started:
      - Home: index.md
      - Installation: get-started/installation.md
      - Tool overview: get-started/tool-overview.md
      - Workflows:
          - Bulk ATAC-seq: get-started/workflows/bulk-atac-seq.md
          - Single-cell ATAC-seq: get-started/workflows/single-cell.md
          - Optional de novo motif discovery: get-started/workflows/de-novo-motif-discovery.md
      - Commands:
          - Core analysis:
              - prepare-atac: get-started/commands/prepare-atac.md
              - atac-correct: get-started/commands/atac-correct.md
              - call-footprints: get-started/commands/call-footprints.md
              - match-motifs: get-started/commands/match-motifs.md
              - diff-footprints: get-started/commands/diff-footprints.md
              - normalize-bigwig: get-started/commands/normalize-bigwig.md
          - Visualization and review:
              - plot-aggregate: get-started/commands/plot-aggregate.md
              - review-multi-comparisons: get-started/commands/review-multi-comparisons.md
          - Workflow and interface:
              - bulk-footprinting: get-started/commands/bulk-footprinting.md
              - sc-footprinting: get-started/commands/sc-footprinting.md
              - run-yaml-workflow: get-started/commands/run-yaml-workflow.md
              - fp-tools-gui: get-started/commands/fp-tools-gui.md
          - De Novo Motif Discovery:
              - discover-motifs: get-started/commands/discover-motifs.md
              - summarize-motifs: get-started/commands/summarize-motifs.md
          - Single-cell ATAC-seq:
              - pseudobulk-fragments: get-started/commands/pseudobulk-fragments.md
              - find-signature-fp: get-started/commands/find-signature-fp.md
      - Output examples:
          - Bulk ATAC-seq: get-started/output-examples/bulk-atac-seq.md
          - Single-cell ATAC-seq: get-started/output-examples/single-cell-atac-seq.md
  - Output Demo: reports.md
  - GUI Demo: gui.md
  - API Reference: api.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/oncologylab/fp-tools
      name: fp-tools on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/fp-tools-bio/
      name: fp-tools-bio on PyPI
