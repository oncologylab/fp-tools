name: Container

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - Dockerfile
      - packaging/container/environment.yml
      - pyproject.toml
      - src/**
      - .github/workflows/container.yml

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/oncologylab/fp-tools
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - name: Build amd64 smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: fp-tools:smoke
          cache-from: type=gha
      - name: Test packaged command and GUI health
        shell: bash
        run: |
          docker run --rm fp-tools:smoke atac-correct --help >/dev/null
          docker run --rm -d --name fp-tools-gui-smoke -p 8891:8891 fp-tools:smoke
          trap 'docker rm -f fp-tools-gui-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8891/_stcore/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs fp-tools-gui-smoke
          exit 1
      - name: Build and optionally publish the complete environment
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
