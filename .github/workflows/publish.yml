name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: linux-x86_64, os: ubuntu-latest, archs: x86_64}
          - {label: linux-arm64, os: ubuntu-24.04-arm, archs: aarch64}
          - {label: macos, os: macos-latest, archs: "x86_64 arm64"}
          - {label: windows-x64, os: windows-latest, archs: AMD64}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.label }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build --sdist --outdir dist && python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade twine && python -m twine check dist/*
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*
