name: Release smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published release version, for example 0.2.2
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-managed-meme:
    name: Windows public EXE / ${{ matrix.case }} discovery
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        case: [default, extra]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download and verify the released executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:RELEASE_VERSION -replace '^v', ''
          gh release download "v$version" --repo $env:GITHUB_REPOSITORY --pattern 'fp-tools-gui-windows-x64.exe' --pattern 'SHA256SUMS.txt' --dir release
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          $line = Get-Content release/SHA256SUMS.txt | Where-Object { $_ -match 'fp-tools-gui-windows-x64.exe$' }
          $expected = ($line -split '\s+')[0]
          $actual = (Get-FileHash release/fp-tools-gui-windows-x64.exe -Algorithm SHA256).Hash
          if (!$expected -or $actual -ne $expected) { throw 'Windows EXE checksum mismatch' }
      - name: Run fresh-import and cached discovery through the public EXE
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/smoke_windows_meme_release.py release/fp-tools-gui-windows-x64.exe --version $env:RELEASE_VERSION --case ${{ matrix.case }}
          if ($LASTEXITCODE -ne 0) { throw 'Public Windows discovery failed' }
      - name: Run the complete real PBMC tutorial
        if: matrix.case == 'default'
        shell: pwsh
        run: |
          python scripts/smoke_pbmc_demo_release.py release/fp-tools-gui-windows-x64.exe --version '${{ inputs.version }}'
          if ($LASTEXITCODE -ne 0) { throw 'Public Windows PBMC tutorial failed' }
  macos-managed-meme:
    name: macOS Apple Silicon / clean-cache managed MEME
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Download and mount the released application
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version="${RELEASE_VERSION#v}"
          mkdir -p release release-mount
          gh release download "v${version}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "fp-tools-gui-macos-apple-silicon.dmg" \
            --dir release
          hdiutil attach -nobrowse -readonly \
            -mountpoint release-mount \
            release/fp-tools-gui-macos-apple-silicon.dmg
      - name: Run first-use and cached motif discovery
        run: >-
          python3 scripts/smoke_frozen_meme_release.py
          release-mount/fp-tools.app/Contents/MacOS/fp-tools-gui
      - name: Run the complete real PBMC tutorial
        run: >-
          python3 scripts/smoke_pbmc_demo_release.py
          release-mount/fp-tools.app/Contents/MacOS/fp-tools-gui
          --version '${{ inputs.version }}'
      - name: Unmount the released application
        if: always()
        run: hdiutil detach release-mount || true
