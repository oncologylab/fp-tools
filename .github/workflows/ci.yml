name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      slow_regressions:
        description: "Run opt-in slow atac-correct regression"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  portable-install:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package using binary dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: .
          python -m pip check
      - name: Portable command and I/O tests
        run: |
          python scripts/smoke_console_scripts.py
          python -m unittest discover -s tests -p "test_cross_platform_io.py" -v
          python -m unittest discover -s tests -p "test_gui_launcher.py" -v

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip build twine
          .venv/bin/python -m pip install --only-binary=:all: -e .

      - name: Build and check release artifacts
        run: |
          .venv/bin/python -m pip install build
          (cd /tmp && $GITHUB_WORKSPACE/.venv/bin/python -m build $GITHUB_WORKSPACE --outdir $GITHUB_WORKSPACE/dist)
          .venv/bin/python -m twine check dist/*

      - name: Wheel install smoke test
        run: |
          python -m venv /tmp/fp-tools-wheel-smoke
          /tmp/fp-tools-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/fp-tools-wheel-smoke/bin/python -m pip install dist/*.whl
          .venv/bin/python scripts/smoke_console_scripts.py --bin-dir /tmp/fp-tools-wheel-smoke/bin

      - name: Run unit and regression tests
        env:
          FP_TOOLS_RUN_SLOW_REGRESSIONS: ${{ github.event.inputs.slow_regressions == 'true' && '1' || '0' }}
        run: .venv/bin/python -m unittest discover -s tests -v
